# Copy to <repo root>/config/triage.yaml and adjust.
# The search is always scoped to `in:inbox`; nothing here can widen it.

query:
  only_unread: true
  # Leave bank emails to apps/moneywiz-export (run it first).
  exclude_labels:
    - banks-bac
    - banks-scotiabank
    - banks-promerica
  # Extra Gmail search terms, ANDed with the inbox scope. Example: newer_than:30d
  extra: ""
  max_messages: 200

# Label added to archived messages.
processed_label: Triage/Processed

classifier:
  enabled: true
  # Must be localhost. Any TypeSafe-compatible /v1/systemone server works
  # (Von, Rizzo Flow, Kev, ollaya).
  base_url: http://127.0.0.1:8765
  model: von-latest
  api_key_env: VON_API_KEY
  timeout_seconds: 30
  # Below this calibrated probability the message stays in the inbox for review.
  min_confidence: 0.85
  # At or above this probability of "needs your action", always keep + high priority.
  needs_action_threshold: 0.7

# Categories are also the classifier's choices; descriptions are what it reads.
# Do not add a catch-all like "other": choice models collapse onto it. Messages
# that fit no category get low confidence and stay in the inbox for review.
#   action: keep | archive | trash      priority: high | normal | low
#   human_only: true  -> automated senders (noreply, alerts, unsubscribe lists)
#                        can never land here; the next-best category is used.
#   awareness: true   -> listed per platform in the digest's "For awareness"
#                        section when archived/trashed.
#   rule_only: true   -> only rules assign it; never a classifier choice. Use it
#                        for vague buckets like "fyi" so the model can't collapse
#                        onto them.
categories:
  personal:
    description: Message written personally by a human to the recipient
    action: keep
    priority: high
    human_only: true
  direct_message:
    description: Direct message or mention of you on a social or chat platform
    action: keep
    priority: high
    rule_only: true
  bill_due:
    description: Bill or payment due, failed payment, or renewal that requires action
    action: keep
    priority: high
  risky_transaction:
    description: Cardless cash withdrawal, cash advance, or other sensitive money movement notice
    action: trash
    priority: normal
    awareness: true
  security_alert:
    description: Account security notice such as new sign-in, new device, session, password change, or verification code
    action: trash
    priority: normal
    awareness: true
  github_security:
    description: GitHub or Dependabot security alert, vulnerability, or security fix pull request
    action: archive
    priority: low
  github:
    description: Other GitHub notification about issues, pull requests, reviews, or CI
    action: archive
    priority: low
  statement:
    description: Bank, card, utility, or account statement or balance notice
    action: archive
    priority: low
  receipt:
    description: Purchase receipt, transaction or payment confirmation, electronic invoice, shipping or delivery update
    action: archive
    priority: low
  newsletter:
    description: Newsletter, digest, blog, social network notification, or content subscription
    action: archive
    priority: low
  promotion:
    description: Marketing, sale, offer, coupon, or product announcement
    action: trash
    priority: low
  fyi:
    description: Notices from known platforms you only want summarized
    action: archive
    priority: low
    awareness: true
    rule_only: true

# Rules run before the classifier; first match wins. Within `match`, every key
# must match; list values match if any item matches. Put personal sender
# domains in your private config/triage.yaml, not in this tracked example.
rules:
  - name: risky-transactions
    category: risky_transaction
    match:
      subject_contains: [retiro sin tarjeta, cardless withdrawal]
  - name: account-security-notices
    category: security_alert
    match:
      subject_contains:
        - new sign-in
        - new device
        - security alert
        - verification code
        - inicio de sesión
        - sesión se inició
        - nuevo dispositivo
        - alerta de seguridad
        - código de verificación
  - name: github-security
    category: github_security
    match:
      sender_domains: [github.com]
      subject_regex: "(security|vulnerab|CVE-|GHSA-|dependabot)"
  - name: github-other
    category: github
    match:
      sender_domains: [github.com]
  - name: statements
    category: statement
    match:
      subject_contains: [estado de cuenta, e-statement, activity statement]
  - name: e-invoices
    category: receipt
    match:
      subject_contains: [factura electrónica, tiquete electrónico, tu tiquete]
  # Must come before social-networks: keep real messages and mentions only.
  - name: social-direct-senders
    category: direct_message
    match:
      sender_emails: [inmail-hit-reply@linkedin.com, messaging-digest-noreply@linkedin.com]
  - name: social-mentions
    category: direct_message
    match:
      sender_domains: [linkedin.com, discord.com, facebookmail.com]
      subject_regex: "mentioned you|sent you (a|\\d+) (new )?messages?|replied to your|te mencionó|te envió (un|\\d+) mensajes?|respondió a tu"
  - name: social-networks
    category: newsletter
    match:
      sender_domains: [linkedin.com, facebookmail.com]
  - name: gmail-promotions-with-unsubscribe
    category: promotion
    match:
      gmail_categories: [promotions]
      has_list_unsubscribe: true
