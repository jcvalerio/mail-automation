[project]
name = "inbox-triage"
version = "0.1.0"
description = "Local Gmail inbox triage with rules and a localhost System One classifier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gmail-core",
  "pyyaml>=6.0.2",
]

[project.scripts]
inbox-triage = "inbox_triage.cli:main"

[tool.uv.sources]
gmail-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_triage"]
