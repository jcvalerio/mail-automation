[project]
name = "gmail-moneywiz-export"
version = "0.1.0"
description = "Local Gmail bank email exporter for MoneyWiz CSV imports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gmail-core",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.14.5",
]

[project.scripts]
gmail-moneywiz-export = "gmail_moneywiz_export.cli:main"

[tool.uv.sources]
gmail-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_moneywiz_export"]
